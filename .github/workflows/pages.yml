# Publica el juego en la rama gh-pages en cada push a main (tras pasar las pruebas).
# GitHub Pages sirve esa rama: Settings → Pages → Source: «Deploy from a branch» → gh-pages / (root).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: npm test
      - name: Preparar los archivos del juego
        run: |
          mkdir -p _site
          cp -r index.html css js assets README.md ASSET_CREDITS.md _site/
          touch _site/.nojekyll
      - name: Publicar en la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
