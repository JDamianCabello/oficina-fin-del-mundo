# Publica el juego en la rama gh-pages en cada push a main (tras pasar las pruebas).
# GitHub Pages sirve esa rama: Settings → Pages → Source: «Deploy from a branch» → gh-pages / (root).
#
# Cada versión se publica en v/<commit>/ (archivos inmutables) y el index.html
# raíz apunta a la última; version.json permite que el juego abierto detecte la
# versión nueva y se actualice solo (ver js/ui/updater.js y scripts/build-pages.mjs).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: npm test
      - name: Recuperar la publicación anterior (para conservar versiones recientes)
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" _site || mkdir -p _site
          rm -rf _site/.git
      - name: Construir el sitio versionado
        run: node scripts/build-pages.mjs "${GITHUB_SHA::12}" _site
      - name: Publicar en la rama gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::12}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
